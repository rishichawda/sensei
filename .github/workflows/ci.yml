name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install rsvg-convert for the SVG render tests
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm ci
      - run: npm test
      - name: Validate plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - name: Run the mod UI tests
        run: npx --yes @anthropic-ai/claude-code plugin test .
