name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate the marketplace manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict
      - name: Validate the plugin manifest, its skills and hooks
        run: npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
      - name: Run the mod UI tests
        run: npx --yes @anthropic-ai/claude-code plugin test .
